        .mobile-menu-overlay a { color:var(--bg); text-decoration:none; font-size:1.5rem; font-weight:600; font-family:'Outfit',sans-serif; }

            display: flex;
            flex-direction: column;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: clamp(1.5rem, 3vw, 2.2rem);
            transition: all 0.35s ease;
            cursor: pointer;
            height: 100%;
        }
        .service-card:hover {
            background: var(--white);
            border-color: var(--accent);
            transform: translateY(-5px);
            box-shadow: 0 12px 32px rgba(177,74,44,0.1);
        }
        .service-card .icon-wrap {
            width: 58px; height: 58px;
            background: rgba(177,74,44,0.1);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.75rem;
            margin-bottom: 1.25rem;
            transition: background 0.35s ease;
            flex-shrink: 0;
            /* FIX: use an img inside or just keep the emoji – no filter on hover */
        }

            background: rgba(177,74,44,0.18);
            /* ✅ NO filter here — emoji stays visible */
        }
        .service-card h3 {
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            font-weight: 800;
            color: var(--ink);

            color: var(--ink-soft);
            line-height: 1.7;
            font-size: clamp(0.85rem, 1.8vw, 0.95rem);

        }

            padding: 0.3rem 0.7rem;
            background: rgba(177,74,44,0.08);
            border-radius: 4px;
            font-size: clamp(0.7rem, 1.4vw, 0.78rem);

            color: var(--accent-deep);

        .toast {

            padding: 1rem 1.5rem; border-radius: 8px;
            font-family: 'Outfit', sans-serif; font-weight: 600;
            font-size: 0.95rem; color: #fff;
            animation: slideUp 0.4s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.18);
        }
        .toast.success { background: #2d6a4f; }
        .toast.error   { background: #b14a2c; }

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const useScrollAnimation = (threshold=0.1) => {
    const ref = useRef(null);
    const [isVisible,setIsVisible] = useState(false);
    useEffect(()=>{
        const observer = new IntersectionObserver(
            ([entry])=>{ if(entry.isIntersecting) setIsVisible(true); },
            {threshold, rootMargin:'0px 0px -50px 0px'}
        );
        if(ref.current) observer.observe(ref.current);
        return ()=>observer.disconnect();
    },[threshold]);
    return [ref,isVisible];
};

const AnimatedSection = ({children,delay=0,className=''}) => {
    const [ref,isVisible] = useScrollAnimation();
    return (
        <div ref={ref} className={className} style={{
            opacity:isVisible?1:0,
            transform:isVisible?'translateY(0)':'translateY(40px)',
            transition:`all 0.7s cubic-bezier(0.4,0,0.2,1) ${delay}s`
        }}>{children}</div>
    );
};

        <svg width={size} height={size} viewBox="0 0 100 100">

            <circle cx="50" cy="50" r="40" fill="none" stroke="#b14a2c" strokeWidth="1.2" strokeDasharray="5 3"/>
            <text x="50" y="67" fontFamily="Georgia,'Times New Roman',serif"
                fontSize="52" fontWeight="700" fill={kanji} textAnchor="middle">道</text>
            <rect x="82" y="10" width="6" height="6" fill="#b14a2c"/>
            <rect x="89" y="5"  width="4" height="4" fill="#c39a4a"/>
            <rect x="94" y="1"  width="2" height="2" fill="#c39a4a"/>

    );
};

            </a>

                <li><a href="#servicios"     style={{color:'#5c5346',textDecoration:'none',fontWeight:'600',fontSize:'0.95rem'}}>Servicios</a></li>
                <li><a href="#como-funciona" style={{color:'#5c5346',textDecoration:'none',fontWeight:'600',fontSize:'0.95rem'}}>Proceso</a></li>
                <li><a href="#beneficios"    style={{color:'#5c5346',textDecoration:'none',fontWeight:'600',fontSize:'0.95rem'}}>Beneficios</a></li>
                <li><a href="#contacto"      style={{color:'#5c5346',textDecoration:'none',fontWeight:'600',fontSize:'0.95rem'}}>Contacto</a></li>

            <button style={burger} className="mobile-menu-btn" onClick={()=>setMobileOpen(true)}>

                <span style={{width:'20px',height:'2px',background:'#f4ede0',borderRadius:'2px'}}/>
            </button>
        </nav>
        {mobileOpen && (
            <div className="mobile-menu-overlay" onClick={()=>setMobileOpen(false)}>

            </div>

};

                        </div>

const Contact = () => {
    const [form, setForm] = useState({nombre:'', email:'', telefono:'', mensaje:''});
    const [sending, setSending] = useState(false);
    const [toast, setToast] = useState(null); // {type:'success'|'error', msg:''}

    const showToast = (type, msg) => {
        setToast({type, msg});
        setTimeout(()=>setToast(null), 4000);
    };

    const handleChange = (e) => {
        setForm(prev=>({...prev, [e.target.name]: e.target.value}));
    };

    const handleSubmit = () => {
        // Basic validation
        if (!form.nombre.trim() || !form.email.trim() || !form.mensaje.trim()) {
            showToast('error', '⚠️ Por favor completa nombre, email y tu idea.');
            return;
        }
        if (!/\S+@\S+\.\S+/.test(form.email)) {
            showToast('error', '⚠️ Ingresa un email válido.');
            return;
        }

        setSending(true);

        // Build mailto link — opens default mail client with pre-filled content
        const subject = encodeURIComponent(`[TaoTech] Solicitud de ${form.nombre}`);
        const body = encodeURIComponent(
`Nombre: ${form.nombre}
Email: ${form.email}
Teléfono: ${form.telefono || 'No indicado'}

Mensaje:
${form.mensaje}`
        );
        const mailtoLink = `mailto:taotech.co@gmail.com?subject=${subject}&body=${body}`;

        // Open mail client
        window.location.href = mailtoLink;

        // Small delay then show success + reset
        setTimeout(()=>{
            setSending(false);
            setForm({nombre:'', email:'', telefono:'', mensaje:''});
            showToast('success', '✅ ¡Tu cliente de correo se abrió! Revisa el borrador y envía.');
        }, 800);

                            />

                        <button

                            disabled={sending}
                            style={{width:'100%',padding:'clamp(0.85rem,2vw,1.1rem)',
                                background: sending ? '#5c5346' : '#1f1a14',
                                color:'#f4ede0',border:'none',borderRadius:'6px',
                                fontFamily:'Outfit,sans-serif',fontWeight:'700',
                                fontSize:'clamp(0.9rem,2vw,1rem)',cursor: sending ? 'not-allowed' : 'pointer',
                                transition:'all 0.2s', letterSpacing:'0.5px'

                        <p style={{textAlign:'center',marginTop:'1rem',fontSize:'0.8rem',color:'#5c5346'}}>
